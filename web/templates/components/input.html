<div>
  <label class="mb-1 block font-label-sm text-label-sm uppercase tracking-wider text-outline" for="{{ .Name }}">{{ .Label }}</label>
  <input
    class="user-invalid:border-error h-8 w-full rounded border border-outline-variant/40 bg-surface-container-lowest px-3 font-body-sm text-body-sm text-on-surface placeholder:text-outline transition-colors focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary-container"
    id="{{ .Name }}"
    name="{{ .Name }}"
    type="{{ if .Type }}{{ .Type }}{{ else }}text{{ end }}"
    {{- if .Type }}{{ if eq .Type "file" }}{{ else }} value="{{ .Value }}"{{ end }}{{ else }} value="{{ .Value }}"{{ end }}
    {{- if .Accept }} accept="{{ .Accept }}"{{ end }}
    {{- if .Error }} aria-invalid="true"{{ end }}
  >
  {{ if .Error }}<p class="mt-1 font-body-sm text-body-sm text-error">{{ .Error }}</p>{{ end }}
</div>
