<div>
  <label class="mb-1 block font-label-sm text-label-sm uppercase tracking-wider text-outline" for="{{ .Name }}">{{ .Label }}</label>
  <div class="relative">
    <input
      class="user-invalid:border-error h-8 w-full rounded border border-outline-variant/40 bg-surface-container-lowest pl-3 pr-10 font-body-sm text-body-sm text-on-surface placeholder:text-outline transition-colors focus:border-primary-container focus:outline-none focus:ring-2 focus:ring-primary-container/20"
      id="{{ .Name }}"
      name="{{ .Name }}"
      type="password"
      value="{{ .Value }}"
      {{- if .Autocomplete }} autocomplete="{{ .Autocomplete }}"{{ end }}
      {{- if .Required }} required{{ end }}
      {{- if .Error }} aria-invalid="true"{{ end }}
    >
    <button type="button"
            class="absolute inset-y-0 right-0 flex w-9 items-center justify-center rounded-r text-outline transition-colors hover:text-on-surface"
            amarra-hook="password"
            data-amarra-password-for="#{{ .Name }}"
            data-amarra-label-show="Show password"
            data-amarra-label-hide="Hide password"
            aria-pressed="false"
            aria-label="Show password">
      <span data-amarra-password-icon="show"><span class="material-symbols-outlined text-[18px]">visibility</span></span>
      <span data-amarra-password-icon="hide" class="hidden"><span class="material-symbols-outlined text-[18px]">visibility_off</span></span>
    </button>
  </div>
  {{ if .Error }}<p class="mt-1 font-body-sm text-body-sm text-error">{{ .Error }}</p>{{ end }}
</div>
