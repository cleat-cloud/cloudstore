<div>
  <label class="mb-1 block font-label-sm text-label-sm uppercase tracking-wider text-outline" for="{{ .Name }}">{{ .Label }}</label>
  <select
    class="user-invalid:border-error h-8 w-full cursor-pointer rounded border border-outline-variant/40 bg-surface-container px-3 font-body-sm text-body-sm text-on-surface transition-colors focus:border-primary-container focus:outline-none focus:ring-2 focus:ring-primary-container/20"
    id="{{ .Name }}"
    name="{{ .Name }}"
    {{- if .Error }} aria-invalid="true"{{ end }}
  >{{ .Inner }}</select>
  {{ if .Error }}<p class="mt-1 font-body-sm text-body-sm text-error">{{ .Error }}</p>{{ end }}
</div>
