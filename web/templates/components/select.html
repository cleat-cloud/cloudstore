<div>
  <label class="block text-sm font-medium text-foam/70 mb-1" for="{{ .Name }}">{{ .Label }}</label>
  <select
    class="w-full border border-copper/40 bg-ink text-foam rounded-none px-3 py-2 focus:ring-2 focus:ring-copper outline-none user-invalid:border-red-600"
    id="{{ .Name }}"
    name="{{ .Name }}"
    {{- if .Error }} aria-invalid="true"{{ end }}
  >{{ .Inner }}</select>
  {{ if .Error }}<p class="text-red-600 text-sm mt-1">{{ .Error }}</p>{{ end }}
</div>
