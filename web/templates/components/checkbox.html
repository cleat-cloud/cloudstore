<label class="inline-flex items-center gap-2 text-sm text-foam">
  <input
    type="checkbox"
    id="{{ .Name }}"
    name="{{ .Name }}"
    value="{{ if .Value }}{{ .Value }}{{ else }}true{{ end }}"
    {{- if .Checked }} checked{{ end }}
    {{- if .Error }} aria-invalid="true"{{ end }}
  >
  {{ .Label }}
</label>
